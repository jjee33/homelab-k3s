apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    # Local GPU box (RTX 5070 Ti, Ollama, 10.0.10.237).
    model_list:
      - model_name: "local-chat"          # fast general chat, 100% VRAM, ~80 tok/s
        litellm_params:
          model: "ollama_chat/gemma4:12b"
          api_base: "http://10.0.10.237:11434"
          keep_alive: "30m"
      - model_name: "local-agent"         # clean tool calls
        litellm_params:
          model: "ollama_chat/gpt-oss:20b"
          api_base: "http://10.0.10.237:11434"
      - model_name: "local-coder"
        litellm_params:
          model: "ollama_chat/qwen2.5-coder:14b"
          api_base: "http://10.0.10.237:11434"
      - model_name: "local-embed"
        litellm_params:
          model: "ollama/nomic-embed-text"
          api_base: "http://10.0.10.237:11434"
    # Cloud models intentionally omitted: the Anthropic API account has no credit and Josh uses
    # subscription logins (Hermes) for Claude. Keep this gateway local-only.
    router_settings:
      num_retries: 1
      timeout: 120
    litellm_settings:
      drop_params: true
    general_settings:
      master_key: "sk-litellm-master-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        ports:
        - containerPort: 4000
        args: ["--config", "/etc/litellm/config.yaml"]
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-anthropic
              key: ANTHROPIC_API_KEY
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.10.68
  selector:
    app: litellm
  ports:
  - port: 4000
    targetPort: 4000
